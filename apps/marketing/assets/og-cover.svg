<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">做成，从任务到成品</title>
  <desc id="desc">把散落资料做成一份能交的成果，保留来源、判断和核验记录</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#171717" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#F4F0E6"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="18" height="630" fill="#3157F6"/>

  <g transform="translate(66 56)">
    <g transform="scale(.37)">
      <rect width="160" height="160" rx="26" fill="#171717"/>
      <path d="M30 42h42M30 73h60M30 104h78" fill="none" stroke="#F4F0E6" stroke-width="10"/>
      <path d="M72 42h48v50" fill="none" stroke="#3157F6" stroke-width="10"/>
      <rect x="101" y="87" width="35" height="35" fill="#D7FF4F"/>
    </g>
    <text x="78" y="42" fill="#171717" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="900">做成</text>
    <text x="79" y="61" fill="#3157F6" font-family="Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="2">FROM TASK TO DONE</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="68" y="208" fill="#171717" font-size="66" font-weight="900" letter-spacing="-3">把散落资料，</text>
    <text x="68" y="286" fill="#171717" font-size="66" font-weight="900" letter-spacing="-3">做成一份</text>
    <text x="68" y="364" fill="#3157F6" font-size="66" font-weight="900" letter-spacing="-3">能交的成果。</text>
    <text x="72" y="412" fill="#5F5C55" font-size="20">任务说清楚 · 原文留得住 · 结果查得到</text>
  </g>

  <g transform="translate(70 475)" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <g><rect width="150" height="74" fill="#171717"/><text x="18" y="27" fill="#D7FF4F" font-size="11" font-weight="800">01 / 输入</text><text x="18" y="51" fill="#FFFFFF" font-size="16" font-weight="800">说清任务</text></g>
    <g transform="translate(152)"><rect width="150" height="74" fill="#FFFFFF" stroke="#171717"/><text x="18" y="27" fill="#3157F6" font-size="11" font-weight="800">02 / 判断</text><text x="18" y="51" fill="#171717" font-size="16" font-weight="800">取证与取舍</text></g>
    <g transform="translate(304)"><rect width="150" height="74" fill="#D7FF4F" stroke="#171717"/><text x="18" y="27" fill="#3157F6" font-size="11" font-weight="800">03 / 结果</text><text x="18" y="51" fill="#171717" font-size="16" font-weight="800">带走成品</text></g>
  </g>

  <g transform="translate(625 75)" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="18" y="18" width="492" height="468" fill="#3157F6"/>
    <rect width="492" height="468" fill="#111210" stroke="#171717" stroke-width="3"/>
    <g transform="translate(28 26)">
      <rect width="436" height="52" fill="#F4F0E6"/>
      <rect x="14" y="14" width="24" height="24" fill="#171717"/>
      <rect x="29" y="29" width="10" height="10" fill="#D7FF4F"/>
      <text x="52" y="33" fill="#171717" font-size="15" font-weight="900">当前任务 · 课程汇报</text>
      <text x="350" y="33" fill="#3157F6" font-size="11" font-weight="800">03 / 06</text>
    </g>
    <g transform="translate(28 96)">
      <text fill="#D7FF4F" font-size="10" font-weight="800" letter-spacing="2">CURRENT OUTCOME</text>
      <text y="42" fill="#FFFFFF" font-size="26" font-weight="900">确认能支持结论的原文</text>
      <rect y="64" width="436" height="4" fill="#353732"/><rect y="64" width="218" height="4" fill="#D7FF4F"/>
    </g>
    <g transform="translate(28 191)">
      <rect width="436" height="164" fill="#F4F0E6"/>
      <text x="22" y="30" fill="#3157F6" font-size="11" font-weight="800">研究报告.pdf · 第 12 页</text>
      <text x="22" y="73" fill="#171717" font-size="21" font-weight="900">“结论应与原始资料保持一致，</text>
      <text x="22" y="103" fill="#171717" font-size="21" font-weight="900">并写清适用范围。”</text>
      <rect x="22" y="126" width="132" height="25" fill="#D7FF4F"/><text x="34" y="144" fill="#171717" font-size="10" font-weight="800">原文位置已记录</text>
      <text x="331" y="144" fill="#3157F6" font-size="11" font-weight="900">加入证据 →</text>
    </g>
    <g transform="translate(28 376)">
      <text fill="#B7B8B0" font-size="10">本步带走</text>
      <text y="27" fill="#FFFFFF" font-size="15" font-weight="800">逐条确认过用途的证据卡</text>
      <rect x="316" y="0" width="120" height="38" fill="#D7FF4F"/>
      <text x="376" y="24" fill="#171717" font-size="11" font-weight="900" text-anchor="middle">下一步：结构</text>
    </g>
  </g>
</svg>
